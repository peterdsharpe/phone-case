[project]
name = "phone-case"
version = "0.1.0"
description = "Parametric, 3D-printable case for the Google Pixel 9 Pro XL"
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d>=0.9",
    "numpy",
    "shapely>=2",
    "trimesh",
    "pyvista",
    "matplotlib",
    "scipy",
    "networkx>=3.7",
    "rtree>=1.4.1",
    "numba>=0.68.0",
]

[project.optional-dependencies]
gpu = [
    "numba-cuda[cu12]>=0.30.4",
]

[tool.uv]
package = false
